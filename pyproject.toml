[project]
name = "gdrive-video-mcp"
version = "0.2.0"
description = "Remote MCP server that uploads videos to Cloudinary and returns CDN URLs. Designed to run on Fly.io."
authors = [
    { name = "BenYahya3", email = "bettryu2.tik@outlook.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2.0",
    "cloudinary>=1.40.0",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.scripts]
gdrive-video-mcp = "gdrive_video_mcp.http_app:main"
gdrive-video-mcp-upload = "gdrive_video_mcp.local_uploader:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdrive_video_mcp"]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
